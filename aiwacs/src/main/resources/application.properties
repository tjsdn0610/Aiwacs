spring.application.name=aiwacs

# 프로젝트 폴더의 .env 파일(gitignore 대상)에서 GEMINI_API_KEY 등을 읽어온다. 없으면 무시.
spring.config.import=optional:file:.env[.properties]

# ===== DB (docker-compose.yml의 PostgreSQL) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/aiwacs
spring.datasource.username=aiwacs
spring.datasource.password=${DB_PASSWORD:aiwacs}
# 엔티티(Policy) 구조에 맞춰 테이블을 자동 생성/갱신 (프로토타입 단계용)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ===== Agent =====
# 값을 정하면 같은 토큰을 가진 Agent만 지표를 보낼 수 있다. 비워두면 검사하지 않음.
agent.token=${AGENT_TOKEN:}

# ===== 지표 이력 (Resource Map 그래프) =====
# 1분 평균을 DB에 저장하고, 오늘 포함 이 일수만큼만 남긴다 (화면에서 날짜별로 조회).
history.retention-days=${HISTORY_RETENTION_DAYS:7}

# ===== AI (로컬 LLM - Ollama) =====
# 보안상 서버 지표·프로세스 정보가 외부 클라우드로 나가지 않도록, 같은 기기에서 도는 로컬 모델을 사용한다.
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:gemma3:4b}

# ===== AI (Gemini) — 현재 사용 안 함 (GeminiClient 참고) =====
# API 키는 코드에 넣지 않고 환경변수 또는 .env의 GEMINI_API_KEY로만 받는다.
# gemini.api-key=${GEMINI_API_KEY:}
# 개발·테스트 중에는 .env에 GEMINI_MODEL=gemini-3.5-flash-lite 를 넣어 기본 모델의 무료 한도(하루 20회)를 시연용으로 아껴 둔다
# gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
# 기본 모델이 혼잡(503)하거나 사용 한도를 넘었을(429) 때 대신 쓰는 가벼운 모델
# gemini.fallback-model=gemini-3.5-flash-lite

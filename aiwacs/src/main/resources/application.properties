spring.application.name=aiwacs

# 프로젝트 폴더의 .env 파일(gitignore 대상)에서 GEMINI_API_KEY 등을 읽어온다. 없으면 무시.
spring.config.import=optional:file:.env[.properties]

# ===== DB (docker-compose.yml의 PostgreSQL) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/aiwacs
spring.datasource.username=aiwacs
spring.datasource.password=${DB_PASSWORD:aiwacs}
# 엔티티(Policy) 구조에 맞춰 테이블을 자동 생성/갱신 (프로토타입 단계용)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ===== Agent =====
# 값을 정하면 같은 토큰을 가진 Agent만 지표를 보낼 수 있다. 비워두면 검사하지 않음.
agent.token=${AGENT_TOKEN:}

# ===== 지표 이력 (Resource Map 그래프) =====
# 1분 평균을 DB에 저장하고, 이 시간(시간 단위)이 지난 이력은 지운다.
history.retention-hours=${HISTORY_RETENTION_HOURS:24}

# ===== AI (Gemini) =====
# API 키는 코드에 넣지 않고 환경변수 또는 .env의 GEMINI_API_KEY로만 받는다.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.6-flash

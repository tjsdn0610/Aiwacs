<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AiWACS - 장비 목록</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        background: #eef0f4;
        color: #333;
        font-size: 13px;
      }
      .layout {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 170px;
        background: #fff;
        border-right: 1px solid #e3e6ec;
        flex-shrink: 0;
      }
      .logo {
        padding: 16px 18px;
        font-size: 18px;
        font-weight: 800;
        color: #1b2140;
        border-bottom: 1px solid #eef0f4;
      }
      .logo span {
        color: #3f6ad8;
      }
      .menu {
        padding: 8px 0;
      }
      .menu-item {
        padding: 9px 18px;
        color: #5a6072;
        cursor: pointer;
      }
      .menu-item:hover {
        background: #f5f6fa;
      }
      .menu-item a {
        color: inherit;
        text-decoration: none;
        display: block;
      }
      .menu-cat {
        padding: 9px 18px;
        color: #3a3f52;
        font-weight: 600;
      }
      .menu-item.sub {
        padding-left: 34px;
        font-size: 12px;
        color: #7a8194;
      }
      .menu-item.sub.active {
        background: #3f6ad8;
        color: #fff;
        font-weight: 600;
      }
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .topbar {
        background: #fff;
        border-bottom: 1px solid #e3e6ec;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .breadcrumb {
        color: #7a8194;
        font-size: 12px;
      }
      .breadcrumb b {
        color: #3f6ad8;
      }
      .topbar-right {
        color: #7a8194;
        font-size: 12px;
      }
      .topbar-right b {
        color: #3f6ad8;
      }
      .content {
        padding: 16px;
      }
      .toolbar {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-bottom: 12px;
      }
      .btn {
        padding: 6px 16px;
        border-radius: 4px;
        border: 1px solid #3f6ad8;
        background: #fff;
        color: #3f6ad8;
        cursor: pointer;
        font-size: 13px;
      }
      .btn-primary {
        background: #3f6ad8;
        color: #fff;
      }
      .btn-gray {
        border-color: #c3c8d4;
        color: #7a8194;
      }
      .btn-danger {
        border-color: #d64545;
        color: #d64545;
      }
      .table {
        width: 100%;
        background: #fff;
        border: 1px solid #e3e6ec;
        border-collapse: collapse;
      }
      .table th {
        background: #f5f6fa;
        padding: 11px 12px;
        text-align: left;
        color: #5a6072;
        font-weight: 600;
        border-bottom: 1px solid #e3e6ec;
        font-size: 12px;
      }
      .table td {
        padding: 11px 12px;
        border-bottom: 1px solid #f0f2f6;
        color: #5a6072;
      }
      .table tr:hover {
        background: #fafbfd;
      }
      .empty {
        text-align: center;
        color: #b0b6c4;
        padding: 40px;
      }
      .section-title {
        margin: 28px 0 10px;
        font-weight: 700;
        color: #3a3f52;
        font-size: 14px;
      }
      .section-sub {
        font-weight: 400;
        font-size: 12px;
        color: #9098aa;
      }
      .policy-select {
        padding: 5px 8px;
        border: 1px solid #e3e6ec;
        border-radius: 4px;
        font-size: 12px;
        color: #3a3f52;
        min-width: 220px;
      }
      .on-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #b0b6c4;
        margin-right: 6px;
      }
      .on-dot.on {
        background: #2e9e52;
      }
      .company-tag {
        background: #eaf0fb;
        color: #3f6ad8;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
      }
      .link {
        color: #3f6ad8;
        cursor: pointer;
        text-decoration: underline;
      }
      .del-link {
        color: #d64545;
        cursor: pointer;
      }

      .modal-bg {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 100;
      }
      .modal-bg.show {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 40px;
      }
      .modal {
        background: #fff;
        border-radius: 6px;
        width: 640px;
        max-height: 85vh;
        overflow-y: auto;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      .modal-head {
        padding: 16px 22px;
        border-bottom: 1px solid #eef0f4;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .modal-head h3 {
        font-size: 16px;
        color: #3a3f52;
      }
      .modal-head .close {
        cursor: pointer;
        color: #9098aa;
        font-size: 20px;
        background: none;
        border: none;
      }
      .modal-body {
        padding: 22px;
      }
      .form-row {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
      }
      .form-row label {
        width: 90px;
        color: #5a6072;
        font-weight: 600;
      }
      .form-row input[type="text"] {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid #d5d9e2;
        border-radius: 4px;
        font-size: 13px;
      }
      .metric-block {
        border-top: 1px solid #eef0f4;
        padding: 14px 0;
      }
      .metric-head {
        font-weight: 700;
        color: #3a3f52;
        font-size: 14px;
        margin-bottom: 10px;
      }
      .th-row {
        display: flex;
        gap: 24px;
        padding-left: 8px;
      }
      .th-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .th-item .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }
      .th-item .dot.warn {
        background: #e0a020;
      }
      .th-item .dot.danger {
        background: #d64545;
      }
      .th-item input {
        width: 70px;
        padding: 6px 8px;
        border: 1px solid #d5d9e2;
        border-radius: 4px;
        text-align: center;
        font-size: 13px;
      }
      .th-item .unit {
        color: #9098aa;
      }
      .modal-foot {
        padding: 16px 22px;
        border-top: 1px solid #eef0f4;
        display: flex;
        justify-content: center;
        gap: 8px;
      }
      .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: #3a3f52;
        color: #fff;
        padding: 12px 24px;
        border-radius: 6px;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 200;
      }
      .toast.show {
        opacity: 1;
      }
      .menu-item.active {
        background: #3f6ad8;
        color: #fff;
        font-weight: 600;
      }
      .form-row select {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid #d5d9e2;
        border-radius: 4px;
        font-size: 13px;
        background: #fff;
      }
      .form-hint {
        margin: -8px 0 14px 90px;
        font-size: 11px;
        color: #9098aa;
      }
      .agent-id {
        font-size: 11px;
        color: #9098aa;
      }
      .muted {
        color: #b0b6c4;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="logo" onclick="location.href = '/'" style="cursor: pointer">
          Ai<span>WACS</span>
        </div>
        <div class="menu">
          <div class="menu-item"><a href="/">대시보드</a></div>
          <div class="menu-item active">장비 목록</div>
          <div class="menu-item">ICMP</div>
          <div class="menu-item">프로세스</div>
          <div class="menu-item">추적</div>
          <div class="menu-item">서비스</div>
          <div class="menu-item">로그 조회</div>
          <div class="menu-item">알림</div>
          <div class="menu-item"><a href="/ai">AI 운영 도우미</a></div>
          <div class="menu-cat">정책 관리</div>
          <div class="menu-item sub"><a href="/policy">알림 정책</a></div>
          <div class="menu-item sub">보고서 정책</div>
          <div class="menu-item sub">경로 추적 정책</div>
          <div class="menu-item">그룹 설정</div>
          <div class="menu-item">환경설정</div>
        </div>
      </aside>

      <div class="main">
        <div class="topbar">
          <div class="breadcrumb">홈 &gt; <b>장비 목록</b></div>
          <div class="topbar-right"><b>aiwacs</b>님, 환영합니다.</div>
        </div>
        <div class="content">
          <div class="section-title" style="margin-top: 0">
            모니터링 장비
            <span class="section-sub"
              >— Agent를 실행한 서버가 자동으로 등록됩니다. 고객사와 알림 정책을 지정해 주세요</span
            >
          </div>
          <table class="table">
            <thead>
              <tr>
                <th>상태</th>
                <th>장비 이름</th>
                <th>고객사</th>
                <th>적용 정책</th>
                <th>OS / IP</th>
                <th style="width: 80px">관리</th>
              </tr>
            </thead>
            <tbody id="server-list">
              <tr>
                <td colspan="6" class="empty">불러오는 중...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 장비 수정 모달 -->
    <div class="modal-bg" id="modal">
      <div class="modal">
        <div class="modal-head">
          <h3>장비 정보 수정</h3>
          <button class="close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-id" value="" />
          <div class="form-row">
            <label>Agent ID</label>
            <span id="f-agent" class="agent-id"></span>
          </div>
          <div class="form-row">
            <label>장비 이름</label>
            <input type="text" id="f-name" maxlength="50" placeholder="예: 테라넷-DB01" />
          </div>
          <div class="form-hint">비워두면 Agent ID로 표시됩니다</div>
          <div class="form-row">
            <label>고객사</label>
            <select id="f-company" onchange="fillPolicyOptions(this.value, '')"></select>
          </div>
          <div class="form-row">
            <label>적용 정책</label>
            <select id="f-policy"></select>
          </div>
          <div class="form-hint">선택한 고객사의 정책만 지정할 수 있습니다</div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-primary" onclick="saveServer()">저장</button>
          <button class="btn btn-gray" onclick="closeModal()">취소</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      let servers = [];
      let policies = [];
      let companies = [];

      async function loadAll() {
        try {
          const [s, p, c] = await Promise.all([
            fetch("/api/servers").then((r) => r.json()),
            fetch("/api/policies").then((r) => r.json()),
            fetch("/api/companies").then((r) => r.json()),
          ]);
          servers = s;
          policies = p.policies;
          companies = c;
          renderList();
        } catch (e) {
          console.log(e);
        }
      }

      function renderList() {
        const tbody = document.getElementById("server-list");
        if (!servers.length) {
          tbody.innerHTML =
            '<tr><td colspan="6" class="empty">연결된 장비가 없습니다. 모니터링할 서버에서 Agent를 실행해 주세요.</td></tr>';
          return;
        }
        tbody.innerHTML = servers
          .map(
            (s) => `
      <tr>
        <td><span class="on-dot ${s.online ? "on" : ""}"></span>${s.online ? "온라인" : "오프라인"}</td>
        <td><b>${s.name}</b>${s.displayName ? `<div class="agent-id">Agent ID: ${s.agentName}</div>` : ""}</td>
        <td>${s.company ? `<span class="company-tag">${s.company}</span>` : '<span class="muted">미지정</span>'}</td>
        <td>${s.policyName || '<span class="muted">-</span>'}</td>
        <td>${s.os || "-"} / ${s.ip || "-"}</td>
        <td><span class="link" onclick="openEdit(${s.id})">수정</span></td>
      </tr>`,
          )
          .join("");
      }

      function openEdit(id) {
        const s = servers.find((x) => x.id === id);
        document.getElementById("edit-id").value = s.id;
        document.getElementById("f-agent").textContent = s.agentName;
        document.getElementById("f-name").value = s.displayName || "";
        document.getElementById("f-company").innerHTML =
          '<option value="">미지정</option>' +
          companies
            .map((c) => `<option value="${c}" ${c === s.company ? "selected" : ""}>${c}</option>`)
            .join("");
        fillPolicyOptions(s.company || "", s.policyId);
        document.getElementById("modal").classList.add("show");
      }

      // 고객사를 고르면 그 고객사의 정책만 선택지로 보여줌
      function fillPolicyOptions(company, selectedId) {
        const list = company ? policies.filter((p) => p.company === company) : policies;
        const def = list[0] || policies[0];
        const defLabel = def ? `[${def.company}] ${def.name}` : "없음";
        document.getElementById("f-policy").innerHTML =
          `<option value="">기본 정책 — ${defLabel}</option>` +
          list
            .map(
              (p) =>
                `<option value="${p.id}" ${p.id === selectedId ? "selected" : ""}>[${p.company}] ${p.name}</option>`,
            )
            .join("");
      }

      function closeModal() {
        document.getElementById("modal").classList.remove("show");
      }

      async function saveServer() {
        const id = document.getElementById("edit-id").value;
        const res = await fetch("/api/servers/" + id, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            displayName: document.getElementById("f-name").value,
            company: document.getElementById("f-company").value || null,
            policyId: document.getElementById("f-policy").value || null,
          }),
        });
        const data = await res.json();
        if (!data.ok) {
          showToast(data.error || "저장에 실패했습니다");
          return;
        }
        showToast("장비 정보가 수정되었습니다");
        closeModal();
        loadAll();
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2000);
      }

      loadAll();
      // 온라인 상태 갱신 (모달이 열려 있을 땐 목록만 새로 그림)
      setInterval(async () => {
        try {
          servers = await (await fetch("/api/servers")).json();
          renderList();
        } catch (e) {
          console.log(e);
        }
      }, 5000);
    </script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AiWACS - 알림 내역</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #eef0f4; color: #333; font-size: 13px; }
      .layout { display: flex; min-height: 100vh; }
      .sidebar { width: 190px; background: #fff; border-right: 1px solid #e3e6ec; flex-shrink: 0; }
      .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .topbar { background: #fff; border-bottom: 1px solid #e3e6ec; padding: 10px 22px; display: flex; justify-content: space-between; align-items: center; }
      .breadcrumb { color: #7a8194; font-size: 12px; }
      .breadcrumb b { color: #3f6ad8; }
      .topbar-right { color: #7a8194; font-size: 12px; }
      .topbar-right b { color: #3f6ad8; }
      .content { padding: 20px 22px; }
      .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
      .bar .grow { flex: 1; }
      .btn { padding: 8px 16px; background: #3f6ad8; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
      .btn:hover { background: #2f52b0; }
      .btn.ghost { background: #fff; color: #3a3f52; border: 1px solid #d5d9e2; }
      .btn.ghost:hover { background: #f2f4f8; }
      input[type=text] { font-family: inherit; font-size: 13px; border: 1px solid #d5d9e2; border-radius: 8px; padding: 8px 11px; min-width: 220px; }
      .card { background: #fff; border: 1px solid #e3e6ec; border-radius: 10px; box-shadow: 0 1px 2px rgba(23,32,64,0.04); }
      .card-head { padding: 12px 16px; border-bottom: 1px solid #eef0f4; font-weight: 700; color: #3a3f52; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
      .card-head .cnt { color: #3f6ad8; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
      th { text-align: left; color: #9098aa; font-weight: 600; font-size: 11.5px; padding: 9px 12px; border-bottom: 1px solid #e3e6ec; white-space: nowrap; }
      td { padding: 9px 12px; border-bottom: 1px solid #eef0f4; white-space: nowrap; }
      tr:last-child td { border-bottom: none; }
      td.dev { font-weight: 600; color: #232838; }
      .mono { font-family: "Consolas", monospace; font-variant-numeric: tabular-nums; }
      .lv { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 12px; font-size: 11px; font-weight: 700; }
      .lv-주의 { background: #fbf1da; color: #c9820a; }
      .lv-경고 { background: #fbe6d6; color: #c9600a; }
      .lv-위험 { background: #fbe9e9; color: #d64545; }
      .lv-장애 { background: #f6d7d7; color: #a02020; }
      .st { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 12px; font-size: 11px; font-weight: 700; }
      .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .st-ACTIVE { background: #fbe9e9; color: #d64545; }
      .st-RESOLVED { background: #eef0f3; color: #6b7280; }
      .empty { padding: 26px; text-align: center; color: #9098aa; font-size: 12.5px; }
      /* AI 묶음 */
      .grp { margin-bottom: 16px; }
      .grp:empty { display: none; }
      .grp .card-head .x { margin-left: auto; cursor: pointer; color: #9098aa; font-weight: 400; }
      /* 미처리 / 발생 중 / 전체 탭 + 페이지 */
      .card-head .grow { flex: 1; }
      .tabs { display: inline-flex; gap: 4px; margin-left: 10px; }
      .tabs button { font-family: inherit; font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 14px; border: 1px solid #d5d9e2; background: #fff; color: #5a6072; cursor: pointer; }
      .tabs button.on { background: #3f6ad8; border-color: #3f6ad8; color: #fff; }
      .tabs button .n { margin-left: 4px; opacity: .8; }
      .pager { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; font-size: 12px; color: #7a8194; }
      .pager button { font-family: inherit; border: 1px solid #d5d9e2; background: #fff; border-radius: 6px; padding: 3px 9px; cursor: pointer; color: #3a3f52; }
      .pager button:disabled { opacity: .4; cursor: default; }
      .event { border: 1px solid #e3e6ec; border-radius: 10px; padding: 14px 16px; margin-top: 10px; background: #f8f9fc; }
      .event .eh { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .event .eh .et { font-weight: 700; color: #232838; }
      .event .ek { color: #9098aa; font-weight: 700; font-size: 11px; margin-top: 6px; }
      .event .ev { color: #3a4055; font-size: 12.5px; }
      .note { color: #9aa1b2; font-size: 11px; margin-top: 10px; }
      /* AI 묶음 아코디언 */
      .ev-acc { border: 1px solid #e3e6ec; border-radius: 9px; margin-top: 10px; background: #fff; overflow: hidden; }
      .ev-top { display: flex; align-items: center; gap: 8px; padding: 12px 14px; cursor: pointer; }
      .ev-top:hover { background: #f8f9fc; }
      .ev-arrow { color: #3f6ad8; font-size: 11px; width: 13px; text-align: center; }
      .ev-title { font-weight: 700; color: #232838; }
      .ev-cnt { margin-left: auto; color: #9098aa; font-size: 11.5px; }
      .ev-detail { padding: 2px 16px 14px 35px; border-top: 1px solid #eef0f4; }
      .ev-detail .ek { color: #9098aa; font-weight: 700; font-size: 11px; margin-top: 8px; }
      .ev-detail .ev { color: #3a4055; font-size: 12.5px; }
      .loading { padding: 20px; color: #9098aa; text-align: center; }
      .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(16px); background: #232838; color: #fff; padding: 11px 20px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .28s; z-index: 50; }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      /* 처리 상태 (발생/해제와 별개) */
      .ps { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 12px; font-size: 11px; font-weight: 700; }
      .ps-none { background: #fff4e5; color: #b7650b; }
      .ps-MAINTENANCE { background: #e8effc; color: #2f52b0; }
      .ps-COMPLETE { background: #e7f4ec; color: #1f9d57; }
      .ps-HOLD { background: #f1ecfb; color: #6b46c1; }
      .ps-IGNORE { background: #eef0f3; color: #6b7280; }
      /* 처리 기록 영역 */
      .handle { padding: 14px 16px; border-top: 1px solid #eef0f4; display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; background: #fafbfd; border-radius: 0 0 10px 10px; }
      .handle .lbl { font-weight: 700; color: #3a3f52; font-size: 12.5px; padding-top: 8px; }
      .handle select { font-family: inherit; font-size: 13px; border: 1px solid #d5d9e2; border-radius: 8px; padding: 8px 10px; background: #fff; }
      .handle textarea { flex: 1; min-width: 240px; min-height: 64px; font-family: inherit; font-size: 13px; border: 1px solid #d5d9e2; border-radius: 8px; padding: 8px 11px; resize: vertical; line-height: 1.5; }
      .handle .col { display: flex; flex-direction: column; gap: 6px; }
      .btn.ai { background: #fff; color: #3f6ad8; border: 1px solid #b9c9f2; }
      .btn.ai:hover { background: #eef3fc; }
      .btn:disabled { opacity: .55; cursor: default; }
      .sel-info { color: #3f6ad8; font-weight: 700; font-size: 12px; padding-top: 9px; }
      .filter { display: inline-flex; align-items: center; gap: 6px; background: #eef3fc; color: #2f52b0; border-radius: 14px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
      .filter a { color: #7a8194; text-decoration: none; font-weight: 400; }
      tr.on td { background: #f5f8ff; }
      .ev-links { display: flex; gap: 8px; margin-top: 12px; }
      .ev-links a, .ev-links button { font-family: inherit; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 7px; border: 1px solid #b9c9f2; background: #fff; color: #3f6ad8; text-decoration: none; cursor: pointer; }
      .ev-links a:hover, .ev-links button:hover { background: #eef3fc; }
      @media (max-width: 720px) { .sidebar { display: none; } }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar"></aside>
      <script src="/sidebar.js"></script>
      <div class="main">
        <div class="topbar">
          <div class="breadcrumb">홈 &gt; 알림 &gt; <b>알림 내역</b></div>
          <div class="topbar-right"><b>aiwacs</b>님, 환영합니다.</div>
        </div>
        <div class="content">
          <div class="bar">
            <button class="btn ghost" onclick="load()">새로고침</button>
            <button class="btn" id="groupBtn" onclick="groupActive()" title="발생 중이거나 아직 처리가 끝나지 않은 알림을 같은 서버·같은 자원 기준으로 사건 단위로 모아 봅니다 (원본 알림은 그대로)">✦ AI로 사건 묶기</button>
            <span id="filter"></span>
            <span class="grow"></span>
          </div>

          <!-- 사건 묶기 결과: 표 위에 표시 (알림이 많아도 바로 보이게) -->
          <div class="grp" id="grp"></div>

          <div class="card">
            <div class="card-head">알림 내역
              <span class="tabs" id="tabs"></span>
              <span class="grow"></span>
              <span class="pager" id="pager"></span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th><input type="checkbox" id="chkAll" onclick="toggleAll(this)" /></th>
                    <th>상태</th><th>처리</th><th>장비</th><th>고객사</th><th>설명</th><th>레벨</th>
                    <th>현재값</th><th>발생 시간</th><th>최종 발생</th><th>해제 시간</th><th>지속(초)</th><th>발생횟수</th>
                  </tr>
                </thead>
                <tbody id="rows"><tr><td colspan="13" class="empty">불러오는 중…</td></tr></tbody>
              </table>
            </div>
            <!-- 처리 기록: 발생 중이든 해제됐든 기록 가능. 발생/해제는 지표로 자동 결정되고, 처리는 사람이 남긴다 -->
            <div class="handle">
              <span class="lbl">처리 기록</span>
              <select id="pstatus" title="AiWACS 처리 팝업과 같은 4가지 상태">
                <option value="MAINTENANCE">점검 중 (ON MAINTENANCE)</option>
                <option value="COMPLETE" selected>완료 (COMPLETE)</option>
                <option value="HOLD">보류 (HOLD)</option>
                <option value="IGNORE">무시 (IGNORE)</option>
              </select>
              <textarea id="note" placeholder="처리 내용 — 알림을 고르고 ✦ AI 초안을 누르면, 진단 결과와 조치 이력으로 초안을 써 드립니다 (고쳐서 저장)"></textarea>
              <div class="col">
                <button class="btn ai" id="draftBtn" onclick="draft()">✦ AI 초안</button>
                <button class="btn" onclick="handleSelected()">기록 저장</button>
              </div>
              <span class="sel-info" id="selInfo">선택 0건</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      const lvClass = (l) => "lv lv-" + (l || "주의");
      const stKr = { ACTIVE: "발생", RESOLVED: "해제" };
      let toastTimer;
      function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600); }

      // 주소로 들어온 조건: ?server=이름 (AI 진단에서 넘어옴) / ?select=1,2,3 (사건에서 넘어옴)
      const params = new URLSearchParams(location.search);
      const serverFilter = params.get("server");
      let preselect = params.get("select") ? params.get("select").split(",").map(Number) : null;
      let preselectServer = !!serverFilter; // 처음 한 번: 그 서버의 아직 끝나지 않은(미처리·점검 중·보류) 알림을 골라 둠
      const selected = new Set(); // 5초마다 표를 다시 그려도 선택이 유지되게 따로 보관
      let rowsCache = []; // 지금 페이지에 보이는 알림

      // 탭: 처리 필요(미처리·점검 중·보류) / 발생 중 / 전체 — 기본은 '처리 필요' (끝난 알림이 쌓여도 할 일만 보이게)
      const isOpen = (a) => !["COMPLETE", "IGNORE"].includes(a.processStatus);
      const TABS = [
        { id: "open", name: "처리 필요", test: isOpen },
        { id: "active", name: "발생 중", test: (a) => a.status === "ACTIVE" },
        { id: "all", name: "전체", test: () => true },
      ];
      let tab = "open";
      let page = 0;
      const PAGE = 20;
      function setTab(t) { tab = t; page = 0; load(); }
      function setPage(p) { page = p; load(); }

      if (serverFilter) {
        document.getElementById("filter").innerHTML = `<span class="filter">장비: ${esc(serverFilter)} <a href="/alerts" title="필터 해제">✕</a></span>`;
      }

      async function load() {
        try {
          let list = await (await fetch("/api/alarms/history")).json();
          if (serverFilter) list = list.filter((a) => a.server === serverFilter);
          if (preselect) { preselect.forEach((id) => selected.add(id)); preselect = null; }
          if (preselectServer) { list.filter(isOpen).forEach((a) => selected.add(a.id)); preselectServer = false; }
          // 목록에서 사라진 알림은 선택에서도 뺀다
          const ids = new Set(list.map((a) => a.id));
          [...selected].forEach((id) => { if (!ids.has(id)) selected.delete(id); });

          // 탭 + 페이지
          document.getElementById("tabs").innerHTML = TABS.map((t) =>
            `<button class="${tab === t.id ? "on" : ""}" onclick="setTab('${t.id}')">${t.name}<span class="n">${list.filter(t.test).length}</span></button>`).join("");
          const shown = list.filter(TABS.find((t) => t.id === tab).test);
          const pages = Math.max(1, Math.ceil(shown.length / PAGE));
          page = Math.min(page, pages - 1);
          rowsCache = shown.slice(page * PAGE, page * PAGE + PAGE);
          document.getElementById("pager").innerHTML = shown.length > PAGE
            ? `<button ${page === 0 ? "disabled" : ""} onclick="setPage(${page - 1})">‹</button>${page + 1} / ${pages}<button ${page >= pages - 1 ? "disabled" : ""} onclick="setPage(${page + 1})">›</button>`
            : `${shown.length}건`;

          const tb = document.getElementById("rows");
          if (!rowsCache.length) {
            const msg = tab === "open" ? "처리할 알림이 없습니다. 끝난 알림은 '전체' 탭에서 볼 수 있습니다."
              : tab === "active" ? "지금 발생 중인 알림이 없습니다." : "발생한 알림이 없습니다. 서버에 부하가 걸리면 여기에 쌓입니다.";
            tb.innerHTML = `<tr><td colspan="13" class="empty">${msg}</td></tr>`;
            updateSel();
            return;
          }
          tb.innerHTML = rowsCache.map((a) => {
            const last = (a.processes || []).slice(-1)[0];
            const ps = a.processStatus
              ? `<span class="ps ps-${a.processStatus}" title="${esc(last ? last.at + " " + last.by + ": " + (last.note || "") : "")}">${esc(a.processStatusKr)}${a.processes.length > 1 ? " · " + a.processes.length + "회" : ""}</span>`
              : '<span class="ps ps-none">미처리</span>';
            return `<tr class="${selected.has(a.id) ? "on" : ""}">
            <td><input type="checkbox" class="rowchk" value="${a.id}" ${selected.has(a.id) ? "checked" : ""} onclick="toggleRow(${a.id}, this.checked)" /></td>
            <td><span class="st st-${a.status}">${stKr[a.status] || a.status}</span></td>
            <td>${ps}</td>
            <td class="dev">${esc(a.server)}</td>
            <td>${esc(a.company) || "-"}</td>
            <td>${esc(a.title || a.metric)}</td>
            <td><span class="${lvClass(a.level)}">${esc(a.level)}</span></td>
            <td class="mono">${esc(a.value)}</td>
            <td class="mono">${esc(a.firstAt)}</td>
            <td class="mono">${esc(a.lastAt)}</td>
            <td class="mono">${esc(a.resolvedAt) || "-"}</td>
            <td class="mono">${esc(a.durationSec)}</td>
            <td class="mono">${esc(a.count)}</td>
          </tr>`;
          }).join("");
          updateSel();
        } catch (e) {
          document.getElementById("rows").innerHTML = '<tr><td colspan="13" class="empty">불러오지 못했습니다.</td></tr>';
        }
      }
      function updateSel() {
        document.getElementById("selInfo").textContent = `선택 ${selected.size}건`;
        document.getElementById("chkAll").checked = rowsCache.length > 0 && rowsCache.every((a) => selected.has(a.id));
      }
      function toggleRow(id, on) {
        on ? selected.add(id) : selected.delete(id);
        const tr = document.querySelector(`.rowchk[value="${id}"]`).closest("tr");
        tr.classList.toggle("on", on);
        updateSel();
      }
      function toggleAll(el) {
        rowsCache.forEach((a) => (el.checked ? selected.add(a.id) : selected.delete(a.id)));
        document.querySelectorAll(".rowchk").forEach((c) => { c.checked = el.checked; c.closest("tr").classList.toggle("on", el.checked); });
        updateSel();
      }
      function selectIds(ids) {
        selected.clear();
        ids.forEach((id) => selected.add(id));
        load();
        document.querySelector(".handle").scrollIntoView({ behavior: "smooth", block: "center" });
        toast(`사건의 알림 ${ids.length}건을 선택했습니다. 처리 상태를 고르고 기록하세요.`);
      }

      // AI 처리 기록 초안: 진단 결과 + 조치 이력 + 알림 경과로 초안을 받아 입력칸에 넣는다 (저장은 사람이)
      async function draft() {
        const ids = [...selected];
        if (!ids.length) { toast("초안을 쓸 알림을 선택하세요."); return; }
        const btn = document.getElementById("draftBtn");
        btn.disabled = true;
        btn.textContent = "✦ 작성 중…";
        try {
          const d = await (await fetch("/api/ai/handle-draft", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ids, status: document.getElementById("pstatus").value }) })).json();
          if (!d.ok) { toast(d.reply || "초안을 만들지 못했습니다."); return; }
          document.getElementById("note").value = d.draft;
          document.getElementById("note").focus();
          toast(d.aiNote || (d.source === "ai" ? "AI 초안을 넣었습니다. 확인하고 고쳐서 저장하세요." : "기본 초안을 넣었습니다. 확인하고 고쳐서 저장하세요."));
        } catch (e) {
          toast("초안 요청 중 오류가 발생했습니다.");
        } finally {
          btn.disabled = false;
          btn.textContent = "✦ AI 초안";
        }
      }

      async function handleSelected() {
        const ids = [...selected];
        if (!ids.length) { toast("처리할 알림을 선택하세요."); return; }
        const note = document.getElementById("note").value.trim();
        if (!note) { toast("처리 내용을 입력하세요 (✦ AI 초안으로 시작할 수 있어요)."); return; }
        const sel = document.getElementById("pstatus");
        try {
          const d = await (await fetch("/api/alarms/handle", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ids, status: sel.value, note }) })).json();
          if (!d.ok) { toast(d.error || "기록하지 못했습니다."); return; }
          toast(`${d.handled}건에 '${sel.options[sel.selectedIndex].text}' 기록을 남겼습니다.`);
          document.getElementById("note").value = "";
          selected.clear();
          load();
        } catch (e) { toast("처리 중 오류가 발생했습니다."); }
      }

      // 사건 묶기: 발생 중 + 아직 처리가 끝나지 않은 알림을 사건 단위로 모아 표 '위'에 보여준다 (원본 알림은 그대로)
      async function groupActive() {
        const grp = document.getElementById("grp");
        const btn = document.getElementById("groupBtn");
        btn.disabled = true;
        btn.textContent = "✦ 묶는 중…";
        grp.innerHTML = '<div class="card"><div class="loading">같은 서버·같은 자원 알림을 사건으로 묶고, AI가 사건마다 원인을 해석하는 중…</div></div>';
        try {
          const d = await (await fetch("/api/ai/alarm-group", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ demo: false, scope: "open" }) })).json();
          if (!d.ok) { grp.innerHTML = `<div class="card"><div class="empty" style="color:#a03535">${esc(d.reply)}</div></div>`; return; }
          const events = (d.result && d.result.events) || [];
          const raw = d.rawCount || 0;
          if (!events.length) {
            grp.innerHTML = '<div class="card"><div class="empty">묶을 알림이 없습니다 — 지금 발생 중이거나 처리가 남은 알림이 없어요.</div></div>';
            return;
          }
          grp.innerHTML = `<div class="card"><div class="card-head">✦ 사건 <span class="cnt">${events.length}</span>건 <span style="color:#9098aa;font-weight:400;font-size:12px">알림 ${raw}건 → 사건 ${events.length}건 (원본 알림·발생 횟수는 아래 표에 그대로)</span><span class="x" onclick="document.getElementById('grp').innerHTML=''" title="닫기">✕</span></div>
            <div style="padding:4px 16px 14px">${events.map((e, i) => `
              <div class="ev-acc">
                <div class="ev-top" onclick="toggleEv(${i})">
                  <span class="ev-arrow" id="evarr-${i}">${i === 0 ? "▼" : "▶"}</span>
                  <span class="${lvClass(e.level)}">${esc(e.level)}</span>
                  <span class="ev-title">${esc(e.title)}</span>
                  <span class="ev-cnt">${e.activeCount ? '<b style="color:#d64545">발생 중</b>' : "해제됨 · 처리 필요"} · ${esc(String(e.firstAt).slice(11, 16))}~${esc(String(e.lastAt).slice(11, 16))} · 알림 ${esc(e.alarmCount)}건</span>
                </div>
                <div class="ev-detail" id="evdet-${i}" ${i === 0 ? "" : "hidden"}>
                  <div class="ek">묶인 알림</div><div class="ev">${(e.members || []).map(esc).join("<br>")}</div>
                  <div class="ek">원인 추정</div><div class="ev">${esc(e.cause)}</div>
                  <div class="ek">권장 조치</div><div class="ev">${esc(e.action)}</div>
                  <div class="ev-links">
                    <a href="/ai?serverId=${esc(String(e.key).split("|")[0])}&minutes=30&run=1#diagnose">✦ AI 진단 · 조치</a>
                    <button onclick='selectIds(${JSON.stringify(e.alarmIds || [])})'>이 사건 알림 선택해서 처리</button>
                  </div>
                </div>
              </div>`).join("")}
            </div></div>`;
        } catch (e) {
          grp.innerHTML = '<div class="card"><div class="empty" style="color:#a03535">묶기 중 오류가 발생했습니다.</div></div>';
        } finally {
          btn.disabled = false;
          btn.textContent = "✦ AI로 사건 묶기";
        }
      }

      function toggleEv(i) {
        const det = document.getElementById("evdet-" + i);
        const arr = document.getElementById("evarr-" + i);
        if (!det) return;
        det.hidden = !det.hidden;
        if (arr) arr.textContent = det.hidden ? "▶" : "▼";
      }

      load();
      setInterval(load, 5000);
    </script>
  </body>
</html>

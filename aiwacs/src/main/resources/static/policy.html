<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AiWACS - 알림 정책</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        background: #eef0f4;
        color: #333;
        font-size: 13px;
      }
      .layout {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 170px;
        background: #fff;
        border-right: 1px solid #e3e6ec;
        flex-shrink: 0;
      }
      .logo {
        padding: 16px 18px;
        font-size: 18px;
        font-weight: 800;
        color: #1b2140;
        border-bottom: 1px solid #eef0f4;
      }
      .logo span {
        color: #3f6ad8;
      }
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .topbar {
        background: #fff;
        border-bottom: 1px solid #e3e6ec;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .breadcrumb {
        color: #7a8194;
        font-size: 12px;
      }
      .breadcrumb b {
        color: #3f6ad8;
      }
      .topbar-right {
        color: #7a8194;
        font-size: 12px;
      }
      .topbar-right b {
        color: #3f6ad8;
      }
      .content {
        padding: 16px;
      }
      .toolbar {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-bottom: 12px;
      }
      .btn {
        padding: 6px 16px;
        border-radius: 4px;
        border: 1px solid #3f6ad8;
        background: #fff;
        color: #3f6ad8;
        cursor: pointer;
        font-size: 13px;
      }
      .btn-primary {
        background: #3f6ad8;
        color: #fff;
      }
      .btn-gray {
        border-color: #c3c8d4;
        color: #7a8194;
      }
      .btn-danger {
        border-color: #d64545;
        color: #d64545;
      }
      .table {
        width: 100%;
        background: #fff;
        border: 1px solid #e3e6ec;
        border-collapse: collapse;
      }
      .table th {
        background: #f5f6fa;
        padding: 11px 12px;
        text-align: center;
        color: #5a6072;
        font-weight: 600;
        border-bottom: 1px solid #e3e6ec;
        font-size: 12px;
      }
      .table td {
        padding: 11px 12px;
        border-bottom: 1px solid #f0f2f6;
        color: #5a6072;
        text-align: center;
      }
      .table tr:hover {
        background: #fafbfd;
      }
      .empty {
        text-align: center;
        color: #b0b6c4;
        padding: 40px;
      }
      .company-tag {
        background: #eaf0fb;
        color: #3f6ad8;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
      }
      .link {
        color: #3f6ad8;
        cursor: pointer;
        text-decoration: underline;
      }
      .del-link {
        color: #d64545;
        cursor: pointer;
      }

      .modal-bg {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 100;
      }
      .modal-bg.show {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 40px;
      }
      .modal {
        background: #fff;
        border-radius: 6px;
        width: 640px;
        max-height: 85vh;
        overflow-y: auto;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      .modal-head {
        padding: 16px 22px;
        border-bottom: 1px solid #eef0f4;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .modal-head h3 {
        font-size: 16px;
        color: #3a3f52;
      }
      .modal-head .close {
        cursor: pointer;
        color: #9098aa;
        font-size: 20px;
        background: none;
        border: none;
      }
      .modal-body {
        padding: 22px;
      }
      .form-row {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
      }
      .form-row label {
        width: 90px;
        color: #5a6072;
        font-weight: 600;
      }
      .form-row input[type="text"] {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid #d5d9e2;
        border-radius: 4px;
        font-size: 13px;
      }
      .metric-block {
        border-top: 1px solid #eef0f4;
        padding: 14px 0;
      }
      .metric-head {
        font-weight: 700;
        color: #3a3f52;
        font-size: 14px;
        margin-bottom: 10px;
      }
      /* 알림 레벨 표 (AiWACS 정책 화면처럼 주의/경고/위험/장애 색 머리글 + 아래 입력칸) */
      .lv-table {
        border-collapse: collapse;
        margin-left: 8px;
      }
      .lv-table th {
        width: 78px;
        padding: 4px 0;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        text-align: center;
      }
      .lv-table td {
        padding: 4px 3px;
        text-align: center;
      }
      .lv-table input {
        width: 64px;
        padding: 6px 4px;
        border: 1px solid #d5d9e2;
        border-radius: 4px;
        text-align: center;
        font-size: 13px;
      }
      .lv-table input.bad {
        border-color: #ee3f3a;
        background: #fff4f4;
      }
      .lv-h-caution { background: #f9b300; }
      .lv-h-warning { background: #f59a23; }
      .lv-h-danger { background: #f5652d; }
      .lv-h-critical { background: #ee3f3a; }
      .lv-hint {
        margin: 6px 0 0 8px;
        font-size: 12px;
        color: #9098aa;
      }
      .lv-hint.bad {
        color: #ee3f3a;
      }
      /* 목록의 레벨별 값 (색으로 레벨 구분) */
      .lv-vals span {
        display: inline-block;
        min-width: 26px;
        text-align: center;
        font-weight: 600;
      }
      .lv-vals .v-caution { color: #c98f00; }
      .lv-vals .v-warning { color: #d97a0a; }
      .lv-vals .v-danger { color: #e0501c; }
      .lv-vals .v-critical { color: #d42c27; }
      .lv-vals .sep { min-width: 6px; color: #c5cad6; font-weight: 400; }
      .modal-foot {
        padding: 16px 22px;
        border-top: 1px solid #eef0f4;
        display: flex;
        justify-content: center;
        gap: 8px;
      }
      .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: #3a3f52;
        color: #fff;
        padding: 12px 24px;
        border-radius: 6px;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 200;
      }
      .toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar"></aside>
      <script src="/sidebar.js"></script>

      <div class="main">
        <div class="topbar">
          <div class="breadcrumb">홈 &gt; 정책 관리 &gt; <b>알림 정책</b></div>
          <div class="topbar-right"><b>aiwacs</b>님, 환영합니다.</div>
        </div>
        <div class="content">
          <div class="toolbar">
            <button class="btn btn-primary" onclick="openAdd()">추가</button>
          </div>
          <table class="table">
            <thead>
              <tr>
                <th>고객사</th>
                <th>정책 명</th>
                <th>CPU (주의/경고/위험/장애)</th>
                <th>메모리 (주의/경고/위험/장애)</th>
                <th>디스크 (주의/경고/위험/장애)</th>
                <th>수정일자</th>
                <th style="width: 120px">관리</th>
              </tr>
            </thead>
            <tbody id="policy-list">
              <tr>
                <td colspan="7" class="empty">불러오는 중...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 추가/수정 모달 -->
    <div class="modal-bg" id="modal">
      <div class="modal">
        <div class="modal-head">
          <h3 id="modal-title">알림 정책 추가</h3>
          <button class="close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-id" value="" />
          <div class="form-row">
            <label>고객사</label>
            <input type="text" id="f-company" placeholder="예: 테라넷" />
          </div>
          <div class="form-row">
            <label>정책 명</label>
            <input type="text" id="f-name" placeholder="예: DB서버 정책" />
          </div>
          <!-- CPU / Memory / Disk 레벨 입력 표는 아래 스크립트(renderLevelBlocks)가 채운다 -->
          <div id="level-blocks"></div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-primary" onclick="savePolicy()">저장</button>
          <button class="btn btn-gray" onclick="closeModal()">취소</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      // AiWACS와 같은 알림 레벨 4단계 (낮은 → 높은 순)
      const LEVELS = [
        { key: "caution", label: "주의" },
        { key: "warning", label: "경고" },
        { key: "danger", label: "위험" },
        { key: "critical", label: "장애" },
      ];
      const METRICS = [
        { key: "cpu", label: "CPU (%)" },
        { key: "memory", label: "Memory (%)" },
        { key: "disk", label: "Disk (%)" },
      ];
      // 새 정책 기본값 (PolicyService의 기본값과 같음)
      const DEFAULTS = {
        cpu: { caution: 70, warning: 80, danger: 90, critical: 95 },
        memory: { caution: 80, warning: 85, danger: 90, critical: 95 },
        disk: { caution: 80, warning: 90, danger: 95, critical: 98 },
      };

      function renderLevelBlocks() {
        document.getElementById("level-blocks").innerHTML = METRICS.map(
          (m) => `
          <div class="metric-block">
            <div class="metric-head">${m.label}</div>
            <table class="lv-table">
              <tr>${LEVELS.map((l) => `<th class="lv-h-${l.key}">${l.label}</th>`).join("")}</tr>
              <tr>${LEVELS.map((l) => `<td><input type="number" min="0" max="100" id="${m.key}-${l.key}" oninput="checkOrder('${m.key}')" /></td>`).join("")}</tr>
            </table>
            <div class="lv-hint" id="${m.key}-hint">주의 ≤ 경고 ≤ 위험 ≤ 장애 순으로 입력합니다.</div>
          </div>`,
        ).join("");
      }
      renderLevelBlocks();

      function fillLevels(th) {
        for (const m of METRICS) {
          for (const l of LEVELS) {
            const v = th[m.key] ? th[m.key][l.key] : null;
            document.getElementById(`${m.key}-${l.key}`).value = v ?? "";
          }
          checkOrder(m.key);
        }
      }

      function readLevels(metric) {
        const out = {};
        for (const l of LEVELS) {
          const raw = document.getElementById(`${metric}-${l.key}`).value;
          out[l.key] = raw === "" ? null : +raw;
        }
        return out;
      }

      /** 0~100 범위 + 주의 ≤ 경고 ≤ 위험 ≤ 장애 순서인지 확인하고 표시 (판정 순서가 꼬이지 않게) */
      function checkOrder(metric) {
        const vals = readLevels(metric);
        let prev = null;
        let ok = true;
        for (const l of LEVELS) {
          const v = vals[l.key];
          const bad = v === null || v < 0 || v > 100 || (prev !== null && v < prev);
          document.getElementById(`${metric}-${l.key}`).classList.toggle("bad", bad);
          if (bad) ok = false;
          if (v !== null) prev = prev === null ? v : Math.max(prev, v);
        }
        const hint = document.getElementById(`${metric}-hint`);
        hint.classList.toggle("bad", !ok);
        hint.textContent = ok
          ? "주의 ≤ 경고 ≤ 위험 ≤ 장애 순으로 입력합니다."
          : "0~100 사이 값을 주의 ≤ 경고 ≤ 위험 ≤ 장애 순으로 입력해 주세요.";
        return ok;
      }

      function levelCell(th) {
        if (!th) return "-";
        return (
          '<span class="lv-vals">' +
          LEVELS.map((l) => `<span class="v-${l.key}">${th[l.key] ?? "-"}</span>`).join('<span class="sep">/</span>') +
          "%</span>"
        );
      }

      async function loadList() {
        const res = await fetch("/api/policies");
        const data = await res.json();
        const tbody = document.getElementById("policy-list");
        if (!data.policies.length) {
          tbody.innerHTML =
            '<tr><td colspan="7" class="empty">등록된 정책이 없습니다.</td></tr>';
          return;
        }
        tbody.innerHTML = data.policies
          .map(
            (p) => `
      <tr>
        <td><span class="company-tag">${p.company}</span></td>
        <td>${p.name}</td>
        <td>${levelCell(p.cpu)}</td>
        <td>${levelCell(p.memory)}</td>
        <td>${levelCell(p.disk)}</td>
        <td style="color:#7a8194;white-space:nowrap;">${p.updatedAt || "-"}</td>
        <td>
          <span class="link" onclick='openEdit(${JSON.stringify(p)})'>수정</span> &nbsp;
          <span class="del-link" onclick="delPolicy(${p.id})">삭제</span>
        </td>
      </tr>`,
          )
          .join("");
      }

      function openAdd() {
        document.getElementById("modal-title").textContent = "알림 정책 추가";
        document.getElementById("edit-id").value = "";
        document.getElementById("f-company").value = "";
        document.getElementById("f-name").value = "";
        fillLevels(DEFAULTS);
        document.getElementById("modal").classList.add("show");
      }

      function openEdit(p) {
        document.getElementById("modal-title").textContent = "알림 정책 수정";
        document.getElementById("edit-id").value = p.id;
        document.getElementById("f-company").value = p.company;
        document.getElementById("f-name").value = p.name;
        fillLevels(p);
        document.getElementById("modal").classList.add("show");
      }

      function closeModal() {
        document.getElementById("modal").classList.remove("show");
      }

      async function savePolicy() {
        const id = document.getElementById("edit-id").value;
        // 세 지표를 모두 검사해 표시까지 한 뒤 하나라도 틀리면 저장하지 않음
        const allOk = METRICS.map((m) => checkOrder(m.key)).every(Boolean);
        if (!allOk) {
          showToast("레벨 값 순서를 확인해 주세요 (주의 ≤ 경고 ≤ 위험 ≤ 장애)");
          return;
        }
        const body = {
          company: document.getElementById("f-company").value || "미지정",
          name: document.getElementById("f-name").value || "새 정책",
          cpu: readLevels("cpu"),
          memory: readLevels("memory"),
          disk: readLevels("disk"),
        };
        if (id) {
          await fetch("/api/policies/" + id, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          showToast("정책이 수정되었습니다");
        } else {
          await fetch("/api/policies", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          showToast("정책이 추가되었습니다");
        }
        closeModal();
        loadList();
      }

      async function delPolicy(id) {
        if (!confirm("이 정책을 삭제하시겠습니까?")) return;
        await fetch("/api/policies/" + id, { method: "DELETE" });
        showToast("정책이 삭제되었습니다");
        loadList();
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2000);
      }

      loadList();
    </script>
  </body>
</html>

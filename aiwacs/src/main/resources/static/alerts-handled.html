<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AiWACS - 처리 내역</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #eef0f4; color: #333; font-size: 13px; }
      .layout { display: flex; min-height: 100vh; }
      .sidebar { width: 190px; background: #fff; border-right: 1px solid #e3e6ec; flex-shrink: 0; }
      .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .topbar { background: #fff; border-bottom: 1px solid #e3e6ec; padding: 10px 22px; display: flex; justify-content: space-between; align-items: center; }
      .breadcrumb { color: #7a8194; font-size: 12px; }
      .breadcrumb b { color: #3f6ad8; }
      .topbar-right { color: #7a8194; font-size: 12px; }
      .topbar-right b { color: #3f6ad8; }
      .content { padding: 20px 22px; }
      .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
      .btn.ghost { padding: 8px 16px; background: #fff; color: #3a3f52; border: 1px solid #d5d9e2; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
      .btn.ghost:hover { background: #f2f4f8; }
      .card { background: #fff; border: 1px solid #e3e6ec; border-radius: 10px; box-shadow: 0 1px 2px rgba(23,32,64,0.04); }
      .card-head { padding: 12px 16px; border-bottom: 1px solid #eef0f4; font-weight: 700; color: #3a3f52; font-size: 13.5px; }
      .card-head .cnt { color: #3f6ad8; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
      th { text-align: left; color: #9098aa; font-weight: 600; font-size: 11.5px; padding: 9px 12px; border-bottom: 1px solid #e3e6ec; white-space: nowrap; }
      td { padding: 9px 12px; border-bottom: 1px solid #eef0f4; vertical-align: top; }
      tr:last-child td { border-bottom: none; }
      td.dev { font-weight: 600; color: #232838; white-space: nowrap; }
      .mono { font-family: "Consolas", monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .lv { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 12px; font-size: 11px; font-weight: 700; }
      .lv-주의 { background: #fbf1da; color: #c9820a; }
      .lv-경고 { background: #fbe6d6; color: #c9600a; }
      .lv-위험 { background: #fbe9e9; color: #d64545; }
      .st-done { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 12px; font-size: 11px; font-weight: 700; background: #e7f4ec; color: #1f9d57; }
      .st-done::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .empty { padding: 26px; text-align: center; color: #9098aa; font-size: 12.5px; }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar"></aside>
      <script src="/sidebar.js"></script>
      <div class="main">
        <div class="topbar">
          <div class="breadcrumb">홈 &gt; 알림 &gt; <b>처리 내역</b></div>
          <div class="topbar-right"><b>aiwacs</b>님, 환영합니다.</div>
        </div>
        <div class="content">
          <div class="bar">
            <button class="btn ghost" onclick="load()">새로고침</button>
          </div>
          <div class="card">
            <div class="card-head">처리 내역 <span class="cnt" id="total">0</span>건</div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>처리 상태</th><th>장비</th><th>고객사</th><th>지표</th><th>레벨</th><th>처리자</th><th>처리 내용</th><th>처리 시간</th><th>발생 시간</th></tr>
                </thead>
                <tbody id="rows"><tr><td colspan="9" class="empty">불러오는 중…</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const lvClass = (l) => "lv lv-" + (l || "주의");
      async function load() {
        try {
          const list = await (await fetch("/api/alarms/handled")).json();
          document.getElementById("total").textContent = list.length;
          const tb = document.getElementById("rows");
          if (!list.length) { tb.innerHTML = '<tr><td colspan="9" class="empty">처리한 알림이 없습니다. 알림 내역에서 "선택 처리"로 기록하면 여기에 쌓입니다.</td></tr>'; return; }
          tb.innerHTML = list.map((a) => `<tr>
            <td><span class="st-done">완료</span></td>
            <td class="dev">${esc(a.server)}</td>
            <td>${esc(a.company) || "-"}</td>
            <td>${esc(a.metric)}</td>
            <td><span class="${lvClass(a.level)}">${esc(a.level)}</span></td>
            <td>${esc(a.handledBy) || "-"}</td>
            <td style="white-space:normal;min-width:220px">${esc(a.handleNote) || '<span style="color:#b0b6c4">(내용 없음)</span>'}</td>
            <td class="mono">${esc(a.handledAt)}</td>
            <td class="mono">${esc(a.firstAt)}</td>
          </tr>`).join("");
        } catch (e) {
          document.getElementById("rows").innerHTML = '<tr><td colspan="9" class="empty">불러오지 못했습니다.</td></tr>';
        }
      }
      load();
      setInterval(load, 8000);
    </script>
  </body>
</html>
